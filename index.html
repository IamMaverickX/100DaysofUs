<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100DaysOfUs 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@400;700&family=Amatic+SC:wght@400;700&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F8F5FF;
            --bg-secondary: #F0EBFF;
            --accent: #8A2BE2;
            --accent-light: #9D4EDD;
            --accent-dark: #6A0DAD;
            --text-dark: #333333;
            --text-light: #666666;
            --button-bg: #9370DB;
            --button-hover: #B19CD9;
            --egg-pink: #FF6F91;
            --egg-light: #FFD6E0;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.03) 0%, transparent 20%);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(138, 43, 226, 0.1);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo i {
            font-size: 2.5rem;
            animation: pulse 2s infinite;
            color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            border: 1px solid transparent;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
        }

        /* Main Content */
        main {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        /* Homepage Hero Section */
        .hero {
            text-align: center;
            padding: 40px 0;
            position: relative;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 25px;
            box-shadow: var(--card-shadow);
            position: relative;
            z-index: 2;
            animation: floatIn 1.2s ease-out;
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 25px;
            line-height: 1.2;
            animation: fadeIn 1s ease-out 1s both;
        }

        .hero h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 1.1s both;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 25px;
            line-height: 1.8;
            animation: fadeIn 1s ease-out 1.2s both;
        }

        .heart-bg {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(138, 43, 226, 0.15);
            z-index: 1;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(5deg); }
            50% { transform: translate(-5px, -25px) rotate(-5deg); }
            75% { transform: translate(-10px, -15px) rotate(3deg); }
        }

        /* Section Cards on Homepage */
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin: 60px 0;
        }

        .section-card {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border: 2px solid transparent;
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .section-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-color: rgba(138, 43, 226, 0.1);
        }

        .section-card:hover::before {
            transform: scaleX(1);
        }

        .section-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: var(--accent);
            transition: transform 0.5s ease;
        }

        .section-card:hover .section-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .section-card h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .section-card p {
            color: var(--text-light);
            margin-bottom: 20px;
        }

        /* Page Headers */
        .page-header {
            text-align: center;
            margin: 40px 0 60px 0;
            position: relative;
        }

        .page-header h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: inline-block;
            position: relative;
        }

        .page-header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            border-radius: 2px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        .back-button:hover {
            background-color: var(--accent);
            color: white;
            gap: 15px;
            transform: translateX(-5px);
        }

        /* Open When Cards */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .open-when-card {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .open-when-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .open-when-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: rgba(138, 43, 226, 0.1);
        }

        .open-when-card:hover::before {
            transform: scaleX(1);
        }

        .card-front {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card-front .card-emoji {
            font-size: 3.5rem;
            transition: transform 0.5s ease;
        }

        .open-when-card:hover .card-emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .card-front h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .card-front p {
            color: var(--text-light);
            font-style: italic;
        }

        .card-back {
            display: none;
            padding-top: 15px;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-dark);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-back.active {
            display: block;
        }

        /* Reasons page */
        .reasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .reason-card {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            border-left: 4px solid var(--accent);
            opacity: 0;
            transform: translateY(20px);
        }

        .reason-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reason-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.12);
            background-color: var(--bg-secondary);
        }

        /* Flirty surprises page */
        .flirty-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin: 50px 0;
        }

        .egg-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .egg {
            width: 100px;
            height: 130px;
            background: linear-gradient(to bottom, var(--egg-light), var(--egg-pink));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .egg:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
            animation: none;
        }

        .egg i {
            font-size: 2.5rem;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .egg-crack {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 11;
            color: white;
        }

        .egg-message {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            width: 280px;
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 100;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-style: italic;
            text-align: center;
            border: 1px solid rgba(138, 43, 226, 0.2);
            pointer-events: none;
        }

        .egg-message::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        .egg-message.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            top: -130px;
        }

        /* Pledges page */
        .pledges-container {
            max-width: 800px;
            margin: 40px auto;
        }

        .pledge-card {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            border-left: 5px solid var(--accent);
            position: relative;
            opacity: 0;
            transform: translateX(-20px);
        }

        .pledge-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .pledge-card:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .pledge-card i {
            position: absolute;
            top: 30px;
            right: 30px;
            color: var(--accent);
            font-size: 1.8rem;
            opacity: 0.7;
        }

        /* Closing message page */
        .closing-section {
            max-width: 800px;
            margin: 60px auto;
            text-align: center;
            background-color: white;
            padding: 60px;
            border-radius: 25px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .closing-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
        }

        .closing-section h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .closing-section p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 25px;
            color: var(--text-dark);
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--accent);
            margin-top: 40px;
            animation: fadeIn 1s ease-out 2s both;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.8);
            animation: fadeIn 1s ease-out;
        }

        .heart-emoji {
            color: var(--accent);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Page animations */
        .page-content {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .page-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
            
            .reasons-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .section-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.8rem;
            }
            
            .hero h2 {
                font-size: 1.8rem;
            }
            
            .page-header h2 {
                font-size: 2.3rem;
            }
            
            nav ul {
                gap: 10px;
                flex-wrap: wrap;
            }
            
            nav a {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .egg-message {
                width: 250px;
                font-size: 0.9rem;
            }
            
            .closing-section {
                padding: 40px 25px;
            }
            
            .closing-section h2 {
                font-size: 2.2rem;
            }
            
            .flirty-container {
                gap: 30px;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding: 30px 20px;
            }
            
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            .reasons-grid {
                grid-template-columns: 1fr;
            }
            
            .section-grid {
                grid-template-columns: 1fr;
            }
            
            nav ul {
                justify-content: space-around;
            }
            
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .flirty-container {
                gap: 20px;
            }
            
            .egg-wrapper {
                margin-bottom: 60px;
            }
            
            .egg-message {
                width: 220px;
            }
        }
    </style>
</head>

                <i class="fas fa-heart"></i>

    <template id="home-template">

                    <div class="section-grid">

                        <a href="reasons.html" class="section-card">

                        <a href="flirty.html" class="section-card">

                            <div class="section-icon">🤍</div>

                        <a href="closing.html" class="section-card">
                            <div class="section-icon">💌</div>

                    </div>
                </div>
            </div>

                card.className = 'open-when-card';
                card.innerHTML = `
                    <div class="card-front">
                        <div class="card-emoji">${item.emoji}</div>
                        <h3>${item.title}</h3>
                        <p><em>Click to open</em></p>
                    </div>
                    <div class="card-back">
                        <p>${item.message}</p>
                    </div>
                `;
                
                card.addEventListener('click', function() {
                    const front = this.querySelector('.card-front');
                    const back = this.querySelector('.card-back');
                    
                    // Close any other open cards
                    document.querySelectorAll('.card-back.active').forEach(activeBack => {
                        if (activeBack !== back) {
                            activeBack.classList.remove('active');
                            activeBack.parentElement.querySelector('.card-front').style.display = 'flex';
                        }
                    });
                    
                    if (back.classList.contains('active')) {
                        back.classList.remove('active');
                        front.style.display = 'flex';
                    } else {
                        front.style.display = 'none';
                        back.classList.add('active');
                    }
                });
                
                container.appendChild(card);
            });
        }

        // Load Reasons with staggered animation

            // Shuffle reasons array

            // Display first 60 reasons
            const displayCount = Math.min(shuffledReasons.length, 60);
            
            for (let i = 0; i < displayCount; i++) {
                const reasonCard = document.createElement('div');
                reasonCard.className = 'reason-card';
                reasonCard.textContent = shuffledReasons[i];
                reasonCard.style.transitionDelay = `${i * 0.03}s`;
                container.appendChild(reasonCard);

            // Animate cards in
            setTimeout(() => {
                const cards = container.querySelectorAll('.reason-card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('visible');
                    }, index * 30);
                });
            }, 300);
        }

            const shuffledMessages = [...flirtyMessages].sort(() => Math.random() - 0.5);

            for (let i = 0; i < displayCount; i++) {
                const eggWrapper = document.createElement('div');
                eggWrapper.className = 'egg-wrapper';
                eggWrapper.innerHTML = `

                    <div class="egg">

                        <div class="egg-crack">💥</div>
                    </div>

                const egg = eggWrapper.querySelector('.egg');
                const message = eggWrapper.querySelector('.egg-message');
                const crack = eggWrapper.querySelector('.egg-crack');
                
                egg.style.animationDelay = `${i * 0.2}s`;

                    e.stopPropagation();

                    // Close all other messages
                    document.querySelectorAll('.egg-message').forEach(msg => {
                        if (msg !== message) {
                            msg.classList.remove('active');
                        }
                    });
                    
                    // Toggle this message
                    message.classList.toggle('active');
                    
                    // Show/hide crack effect
                    if (message.classList.contains('active')) {
                        crack.style.opacity = '1';
                        setTimeout(() => {
                            crack.style.opacity = '0';
                        }, 300);
                    }
                });
                
                container.appendChild(eggWrapper);

                if (!e.target.closest('.egg') && !e.target.closest('.egg-message')) {
                    document.querySelectorAll('.egg-message').forEach(msg => {
                        msg.classList.remove('active');
                    });
                }
            });

            else if (path.includes('closing')) currentPage = 'closing.html';
            
            navLinks.forEach(link => {
                const linkHref = link.getAttribute('href');
                if (linkHref === currentPage ||

                } else {
