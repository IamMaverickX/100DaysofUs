<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flirty Surprises - 100DaysOfUs 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@400;700&family=Amatic+SC:wght@400;700&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F8F5FF;
            --bg-secondary: #F0EBFF;
            --accent: #8A2BE2;
            --accent-light: #9D4EDD;
            --accent-dark: #6A0DAD;
            --text-dark: #333333;
            --text-light: #666666;
            --button-bg: #9370DB;
            --button-hover: #B19CD9;
            --egg-pink: #FF6F91;
            --egg-light: #FFD6E0;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.03) 0%, transparent 20%);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(138, 43, 226, 0.1);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo i {
            font-size: 2.5rem;
            animation: pulse 2s infinite;
            color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            border: 1px solid transparent;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
        }

        nav a.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Main Content */
        main {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        /* Page Headers */
        .page-header {
            text-align: center;
            margin: 40px 0 60px 0;
            position: relative;
        }

        .page-header h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: inline-block;
            position: relative;
        }

        .page-header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            border-radius: 2px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        .back-button:hover {
            background-color: var(--accent);
            color: white;
            gap: 15px;
            transform: translateX(-5px);
        }

        /* Flirty surprises page */
        .flirty-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin: 50px 0;
        }

        .egg-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: eggAppear 0.6s ease-out forwards;
        }

        @keyframes eggAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .egg {
            width: 100px;
            height: 130px;
            background: linear-gradient(to bottom, var(--egg-light), var(--egg-pink));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .egg:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
            animation: none;
        }

        .egg i {
            font-size: 2.5rem;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .egg-crack {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 11;
            color: white;
        }

        .egg-message {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            width: 280px;
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 100;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-style: italic;
            text-align: center;
            border: 1px solid rgba(138, 43, 226, 0.2);
            pointer-events: none;
        }

        .egg-message::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        .egg-message.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            top: -130px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.8);
            animation: fadeIn 1s ease-out;
        }

        .heart-emoji {
            color: var(--accent);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Floating hearts */
        .heart-bg {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(138, 43, 226, 0.15);
            z-index: 1;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(5deg); }
            50% { transform: translate(-5px, -25px) rotate(-5deg); }
            75% { transform: translate(-10px, -15px) rotate(3deg); }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .flirty-container {
                gap: 35px;
            }
        }

        @media (max-width: 768px) {
            .page-header h2 {
                font-size: 2.3rem;
            }
            
            nav ul {
                gap: 10px;
                flex-wrap: wrap;
            }
            
            nav a {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .flirty-container {
                gap: 30px;
            }
            
            .egg-message {
                width: 250px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .flirty-container {
                gap: 25px;
            }
            
            .egg-wrapper {
                margin-bottom: 60px;
            }
            
            .egg-message {
                width: 220px;
            }
            
            nav ul {
                justify-content: space-around;
            }
            
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-heart"></i>
                100DaysOfUs
                <i class="fas fa-heart"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="open-when.html" class="nav-link">Open When</a></li>
                    <li><a href="reasons.html" class="nav-link">100 Reasons</a></li>
                    <li><a href="flirty.html" class="nav-link active">Flirty Surprises</a></li>
                    <li><a href="pledges.html" class="nav-link">My Promises</a></li>
                    <li><a href="closing.html" class="nav-link">Closing Message</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            
            <div class="page-header">
                <h2>Flirty Surprises</h2>
                <p>Click on the eggs to crack them open and reveal playful messages</p>
            </div>
            
            <div class="flirty-container" id="flirty-container">
                <!-- Eggs will be generated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Made with <span class="heart-emoji">💜</span> for the most special person</p>
            <p>100DaysOfUs © <span id="current-year"></span></p>
        </div>
    </footer>

    <script>
        // Current year for footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Flirty Messages Data
        const flirtyMessages = [
            "I can't wait to see that smile in person… it's addictive 😌💖",
            "Stop looking this good, you're making me distracted 😏🔥",
            "Just so you know, you're my favorite notification 🥰📲",
            "I'm still thinking about that look you gave me… can't get it out of my head 😏💛",
            "If I were there, I'd be stealing kisses all day 😘💌",
            "You're dangerously cute, you know that? 😏💖",
            "Every time you laugh, I lose a little focus… in the best way 😂💛",
            "I might be overthinking, or maybe I'm just thinking about you… all the time 😏💌",
            "I hope you're saving some blushes for me 😌💖",
            "You make 'missing you' feel like a game I never want to win 😏💛",
            "Your selfies should come with a warning 😘🔥",
            "I think you broke my heart… in the best way 😌💖",
            "You're a little trouble… and I like it 😏💛",
            "If you keep looking this good from afar, I'll never survive our reunion 😘💌",
            "I might have a problem… it's called thinking about you too much 😏💖"
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Add floating hearts
            addFloatingHearts();
            
            // Load Flirty Eggs
            loadFlirtyEggs();
            
            // Set active navigation link
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });

        function addFloatingHearts() {
            const main = document.querySelector('main');
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = ['💜', '💟', '💜', '💟', '💜', '💟'][Math.floor(Math.random() * 6)];
                heart.style.left = `${Math.random() * 90}%`;
                heart.style.top = `${Math.random() * 90}%`;
                heart.style.fontSize = `${Math.random() * 1 + 1}rem`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                main.appendChild(heart);
            }
        }

        function loadFlirtyEggs() {
            const container = document.getElementById('flirty-container');
            if (!container) return;
            
            container.innerHTML = '';
            
            // Shuffle flirty messages
            const shuffledMessages = [...flirtyMessages].sort(() => Math.random() - 0.5);
            
            // Display all eggs
            const displayCount = Math.min(shuffledMessages.length, 15);
            
            for (let i = 0; i < displayCount; i++) {
                const eggWrapper = document.createElement('div');
                eggWrapper.className = 'egg-wrapper';
                eggWrapper.style.animationDelay = `${i * 0.2}s`;
                eggWrapper.innerHTML = `
                    <div class="egg-message">${shuffledMessages[i]}</div>
                    <div class="egg">
                        <i class="fas fa-egg"></i>
                        <div class="egg-crack">💥</div>
                    </div>
                `;
                
                const egg = eggWrapper.querySelector('.egg');
                const message = eggWrapper.querySelector('.egg-message');
                const crack = eggWrapper.querySelector('.egg-crack');
                
                egg.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isActive = message.classList.contains('active');
                    
                    // Close all other messages
                    document.querySelectorAll('.egg-message').forEach(msg => {
                        if (msg !== message) {
                            msg.classList.remove('active');
                        }
                    });
                    
                    // Toggle this message
                    message.classList.toggle('active');
                    
                    // Show/hide crack effect
                    if (message.classList.contains('active')) {
                        crack.style.opacity = '1';
                        setTimeout(() => {
                            crack.style.opacity = '0';
                        }, 300);
                    }
                });
                
                container.appendChild(eggWrapper);
            }
            
            // Close messages when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.egg') && !e.target.closest('.egg-message')) {
                    document.querySelectorAll('.egg-message').forEach(msg => {
                        msg.classList.remove('active');
                    });
                }
            });
        }
    </script>
</body>
</html>
