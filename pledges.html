<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Promises - 100DaysOfUs 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@400;700&family=Amatic+SC:wght@400;700&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F8F5FF;
            --bg-secondary: #F0EBFF;
            --accent: #8A2BE2;
            --accent-light: #9D4EDD;
            --accent-dark: #6A0DAD;
            --text-dark: #333333;
            --text-light: #666666;
            --button-bg: #9370DB;
            --button-hover: #B19CD9;
            --egg-pink: #FF6F91;
            --egg-light: #FFD6E0;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.03) 0%, transparent 20%);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(138, 43, 226, 0.1);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo i {
            font-size: 2.5rem;
            animation: pulse 2s infinite;
            color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            border: 1px solid transparent;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
        }

        nav a.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Main Content */
        main {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        /* Page Headers */
        .page-header {
            text-align: center;
            margin: 40px 0 60px 0;
            position: relative;
        }

        .page-header h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: inline-block;
            position: relative;
        }

        .page-header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            border-radius: 2px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        .back-button:hover {
            background-color: var(--accent);
            color: white;
            gap: 15px;
            transform: translateX(-5px);
        }

        /* Pledges page */
        .pledges-container {
            max-width: 800px;
            margin: 40px auto;
        }

        .pledge-card {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            border-left: 5px solid var(--accent);
            position: relative;
            opacity: 0;
            transform: translateX(-20px);
        }

        .pledge-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .pledge-card:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .pledge-card i {
            position: absolute;
            top: 30px;
            right: 30px;
            color: var(--accent);
            font-size: 1.8rem;
            opacity: 0.7;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.8);
            animation: fadeIn 1s ease-out;
        }

        .heart-emoji {
            color: var(--accent);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Floating hearts */
        .heart-bg {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(138, 43, 226, 0.15);
            z-index: 1;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(5deg); }
            50% { transform: translate(-5px, -25px) rotate(-5deg); }
            75% { transform: translate(-10px, -15px) rotate(3deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .page-header h2 {
                font-size: 2.3rem;
            }
            
            nav ul {
                gap: 10px;
                flex-wrap: wrap;
            }
            
            nav a {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .pledge-card {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            nav ul {
                justify-content: space-around;
            }
            
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .pledge-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-heart"></i>
                100DaysOfUs
                <i class="fas fa-heart"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="open-when.html" class="nav-link">Open When</a></li>
                    <li><a href="reasons.html" class="nav-link">100 Reasons</a></li>
                    <li><a href="flirty.html" class="nav-link">Flirty Surprises</a></li>
                    <li><a href="pledges.html" class="nav-link active">My Promises</a></li>
                    <li><a href="closing.html" class="nav-link">Closing Message</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            
            <div class="page-header">
                <h2>My Promises to You</h2>
                <p>Personal pledges for our journey together</p>
            </div>
            
            <div class="pledges-container" id="pledges-container">
                <!-- Pledges will be generated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Made with <span class="heart-emoji">💜</span> for the most special person</p>
            <p>100DaysOfUs © <span id="current-year"></span></p>
        </div>
    </footer>

    <script>
        // Current year for footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Pledges Data
        const pledges = [
            "I promise to always be honest with you, no matter what 🥹❤️",
            "I'll listen to you, even when words are hard to find 😌💛",
            "I vow to support your dreams, big or small 🌟💖",
            "I promise to make you feel safe, loved, and appreciated 🫶🏽❤️",
            "I'll always choose you, every single day 😌💛",
            "I vow to communicate openly, even when it's tough 🥹💖",
            "I promise to respect your space, while never letting you feel alone 🫶🏽❤️",
            "I'll celebrate you, your wins, and everything that makes you… you 😌💛",
            "I promise to grow with you, not apart 🥹💖",
            "I vow to remind you how important you are to me, often 🫶🏽❤️",
            "I promise to be patient with you, and patient with us 😌💛",
            "I'll be your calm in chaos, your safe space 🥹💖",
            "I vow to never take you for granted 🫶🏽❤️",
            "I promise to make you laugh, even on hard days 😌💛",
            "I'll always love you for exactly who you are, without conditions 🥹💖"
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Add floating hearts
            addFloatingHearts();
            
            // Load Pledges with staggered animation
            loadPledges();
            
            // Set active navigation link
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });

        function addFloatingHearts() {
            const main = document.querySelector('main');
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = ['💜', '💟', '💜', '💟', '💜', '💟'][Math.floor(Math.random() * 6)];
                heart.style.left = `${Math.random() * 90}%`;
                heart.style.top = `${Math.random() * 90}%`;
                heart.style.fontSize = `${Math.random() * 1 + 1}rem`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                main.appendChild(heart);
            }
        }

        function loadPledges() {
            const container = document.getElementById('pledges-container');
            if (!container) return;
            
            container.innerHTML = '';
            
            pledges.forEach((pledge, index) => {
                const pledgeCard = document.createElement('div');
                pledgeCard.className = 'pledge-card';
                pledgeCard.innerHTML = `
                    <p>${pledge}</p>
                    <i class="fas fa-heart"></i>
                `;
                pledgeCard.style.transitionDelay = `${index * 0.1}s`;
                container.appendChild(pledgeCard);
            });
            
            // Animate cards in
            setTimeout(() => {
                const cards = container.querySelectorAll('.pledge-card');
                cards.forEach((card, index) => {
                    setTimeout(() => {
                        card.classList.add('visible');
                    }, index * 100);
                });
            }, 300);
        }
    </script>
</body>
</html>
