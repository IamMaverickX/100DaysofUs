<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open When - 100DaysOfUs 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@400;700&family=Amatic+SC:wght@400;700&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F8F5FF;
            --bg-secondary: #F0EBFF;
            --accent: #8A2BE2;
            --accent-light: #9D4EDD;
            --accent-dark: #6A0DAD;
            --text-dark: #333333;
            --text-light: #666666;
            --button-bg: #9370DB;
            --button-hover: #B19CD9;
            --egg-pink: #FF6F91;
            --egg-light: #FFD6E0;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.03) 0%, transparent 20%);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(138, 43, 226, 0.1);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo i {
            font-size: 2.5rem;
            animation: pulse 2s infinite;
            color: var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            border: 1px solid transparent;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
        }

        nav a.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Main Content */
        main {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        /* Page Headers */
        .page-header {
            text-align: center;
            margin: 40px 0 60px 0;
            position: relative;
        }

        .page-header h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: inline-block;
            position: relative;
        }

        .page-header h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            border-radius: 2px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
            border: 1px solid rgba(138, 43, 226, 0.2);
        }

        .back-button:hover {
            background-color: var(--accent);
            color: white;
            gap: 15px;
            transform: translateX(-5px);
        }

        /* Open When Cards */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .open-when-card {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            cursor: pointer;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            opacity: 0;
            transform: translateY(30px);
            animation: cardAppear 0.6s ease-out forwards;
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .open-when-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--accent), var(--button-bg));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .open-when-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: rgba(138, 43, 226, 0.1);
        }

        .open-when-card:hover::before {
            transform: scaleX(1);
        }

        .card-front {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card-front .card-emoji {
            font-size: 3.5rem;
            transition: transform 0.5s ease;
        }

        .open-when-card:hover .card-emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .card-front h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .card-front p {
            color: var(--text-light);
            font-style: italic;
        }

        .card-back {
            display: none;
            padding-top: 15px;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-dark);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-back.active {
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
            color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.8);
            animation: fadeIn 1s ease-out;
        }

        .heart-emoji {
            color: var(--accent);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Floating hearts */
        .heart-bg {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(138, 43, 226, 0.15);
            z-index: 1;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(5deg); }
            50% { transform: translate(-5px, -25px) rotate(-5deg); }
            75% { transform: translate(-10px, -15px) rotate(3deg); }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .page-header h2 {
                font-size: 2.3rem;
            }
            
            nav ul {
                gap: 10px;
                flex-wrap: wrap;
            }
            
            nav a {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            nav ul {
                justify-content: space-around;
            }
            
            nav a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-heart"></i>
                100DaysOfUs
                <i class="fas fa-heart"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="open-when.html" class="nav-link active">Open When</a></li>
                    <li><a href="reasons.html" class="nav-link">100 Reasons</a></li>
                    <li><a href="flirty.html" class="nav-link">Flirty Surprises</a></li>
                    <li><a href="pledges.html" class="nav-link">My Promises</a></li>
                    <li><a href="closing.html" class="nav-link">Closing Message</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            
            <div class="page-header">
                <h2>Open When You Need Me</h2>
                <p>Click on any card to reveal a special message for that moment</p>
            </div>
            
            <div class="cards-container" id="open-when-cards">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Made with <span class="heart-emoji">💜</span> for the most special person</p>
            <p>100DaysOfUs © <span id="current-year"></span></p>
        </div>
    </footer>

    <script>
        // Current year for footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Open When Messages Data
        const openWhenMessages = [
            {
                emoji: "🌧️",
                title: "Open when you're overwhelmed",
                message: "If everything feels like too much right now, pause. Breathe slowly. You don't have to have it all figured out tonight. I believe in you more than you believe in yourself sometimes, and I'm proud of you even on days like this 🤍."
            },
            {
                emoji: "😔",
                title: "Open when you feel like you're not enough",
                message: "Hey… you are more than enough. You don't have to prove anything to earn my love. I chose you as you are, not a perfect version of you. Please be gentle with yourself for me."
            },
            {
                emoji: "😌",
                title: "Open when you need calm",
                message: "Put your phone down for a minute after this. Take one deep breath. Let your shoulders relax. Everything doesn't need an answer right now. I hope my words help you feel a little lighter 🫶🏽."
            },
            {
                emoji: "🥰",
                title: "Open when you feel loved",
                message: "If you're feeling soft and happy, stay there. That feeling is us. I love knowing I get to be part of what makes you feel this way. Thank you for letting me into your heart 🤍."
            },
            {
                emoji: "🌙",
                title: "Open when you're thinking about us",
                message: "100 days with you and it already feels like something I don't want to lose. We're not perfect, but we're real, and I value that deeply. I'm grateful for you and for the way we keep choosing each other."
            },
            {
                emoji: "😘",
                title: "Open when you want something sweet",
                message: "Just a reminder that you're beautiful, inside and out. And yes, I'm smiling while writing this because thinking about you always does that to me 😌🤍."
            }
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Add floating hearts
            addFloatingHearts();
            
            // Load Open When cards
            loadOpenWhenCards();
            
            // Set active navigation link
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });

        function addFloatingHearts() {
            const main = document.querySelector('main');
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = ['💜', '💟', '💜', '💟', '💜', '💟'][Math.floor(Math.random() * 6)];
                heart.style.left = `${Math.random() * 90}%`;
                heart.style.top = `${Math.random() * 90}%`;
                heart.style.fontSize = `${Math.random() * 1 + 1}rem`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                main.appendChild(heart);
            }
        }

        function loadOpenWhenCards() {
            const container = document.getElementById('open-when-cards');
            if (!container) return;
            
            container.innerHTML = '';
            
            openWhenMessages.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'open-when-card';
                card.style.animationDelay = `${index * 0.2}s`;
                card.innerHTML = `
                    <div class="card-front">
                        <div class="card-emoji">${item.emoji}</div>
                        <h3>${item.title}</h3>
                        <p><em>Click to open</em></p>
                    </div>
                    <div class="card-back">
                        <p>${item.message}</p>
                    </div>
                `;
                
                card.addEventListener('click', function() {
                    const front = this.querySelector('.card-front');
                    const back = this.querySelector('.card-back');
                    
                    // Close any other open cards
                    document.querySelectorAll('.card-back.active').forEach(activeBack => {
                        if (activeBack !== back) {
                            activeBack.classList.remove('active');
                            activeBack.parentElement.querySelector('.card-front').style.display = 'flex';
                        }
                    });
                    
                    if (back.classList.contains('active')) {
                        back.classList.remove('active');
                        front.style.display = 'flex';
                    } else {
                        front.style.display = 'none';
                        back.classList.add('active');
                    }
                });
                
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
